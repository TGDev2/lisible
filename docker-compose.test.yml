# Docker Compose for integration tests (E10-S3)
# Usage: docker compose -f docker-compose.test.yml up -d
# Provides an isolated Postgres instance on port 5433
# Set TEST_DATABASE_URL=postgresql://postgres:postgres@localhost:5433/sme_studio_test

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: sme-studio-postgres-test
    environment:
      POSTGRES_DB: sme_studio_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sme_studio_test']
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed in CI
