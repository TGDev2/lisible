# Docker Compose for integration tests (E10-S3)
# Usage: docker compose -f docker-compose.test.yml up -d
# Provides Postgres (5433) + Neon wsproxy (5434)
# Set TEST_DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/sme_studio_test
# Set NEON_WS_PROXY=127.0.0.1:5434/v1

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: sme-studio-postgres-test
    environment:
      POSTGRES_DB: sme_studio_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sme_studio_test']
      interval: 5s
      timeout: 5s
      retries: 5
    tmpfs:
      - /var/lib/postgresql/data  # In-memory for speed in CI

  wsproxy-test:
    image: ghcr.io/neondatabase/wsproxy:latest
    container_name: sme-studio-wsproxy-test
    environment:
      ALLOW_ADDR_REGEX: .*
    ports:
      - '5434:80'
    depends_on:
      postgres-test:
        condition: service_healthy
